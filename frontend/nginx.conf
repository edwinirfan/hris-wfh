server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # mime.types bawaan nginx (≥1.21) sudah memetakan .wasm → application/wasm

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;

  # aset ber-hash dari Vite → cache lama
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # model & wasm MediaPipe jarang berubah
  location ~ ^/(models|mediapipe)/ {
    expires 7d;
    add_header Cache-Control "public";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # SPA: semua rute lain ke index.html
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
